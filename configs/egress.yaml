# Per-session egress allowlists for the smokescreen sidecar (B4, B5).
# No model host is listed: hosted model calls go through vigild's gateway
# (P1), so the gateway is the only model endpoint a container can reach.
gateway:
  host: host.docker.internal
  port: 8788
  # smokescreen blocks private ranges by default, and host.docker.internal
  # is one. Docker Desktop's host range is allowed, for the gateway only.
  allow_range: 192.168.65.0/24
collector:
  host: otel-collector       # attached to each session network; never proxied
  port: 4318
roles:
  coord:    [api.github.com, github.com]
  worker:   [api.github.com, github.com, pypi.org, files.pythonhosted.org, registry.npmjs.org]
  reviewer: [api.github.com, github.com]
  auditor:  [api.github.com, github.com]
